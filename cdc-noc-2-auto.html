'use strict';

/* ---------------- Utilidades ---------------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayStr = () => new Date().toLocaleDateString('es-VE', {year:'numeric', month:'2-digit', day:'2-digit'});

function encode64(bytes){ return btoa(String.fromCharCode(...bytes)); }
function decode64(value){ return Uint8Array.from(atob(value), c=>c.charCodeAt(0)); }

async function passwordMaterial(password, salt=encode64(crypto.getRandomValues(new Uint8Array(16)))){
  const source = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:decode64(salt), iterations:600000}, source, 512));
  return {salt, hash:encode64(bits.slice(0,32)), key:bits.slice(32)};
}

async function encryptCredential(userId, credential, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const aes = await crypto.subtle.importKey('raw', key, 'AES-GCM', false, ['encrypt']);
  const data = await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:new TextEncoder().encode(userId)}, aes, new TextEncoder().encode(JSON.stringify(credential)));
  return {iv:encode64(iv), data:encode64(new Uint8Array(data))};
}

async function decryptCredential(user, key){
  const aes = await crypto.subtle.importKey('raw', key, 'AES-GCM', false, ['decrypt']);
  const data = await crypto.subtle.decrypt({name:'AES-GCM', iv:decode64(user.saeplus.iv), additionalData:new TextEncoder().encode(user.id)}, aes, decode64(user.saeplus.data));
  return JSON.parse(new TextDecoder().decode(data));
}

async function migratePanelPasswords(){
  for (const user of DB.users){
    if (typeof user.password !== 'string') continue;
    const material = await passwordMaterial(user.password);
    user.passwordSalt = material.salt;
    user.passwordHash = material.hash;
    delete user.password;
  }
}

/* ---------------- Autenticación ---------------- */
let currentUser = null;
let panelKey = null;

function sessionSave(){
  localStorage.setItem('cdcNoc2_session', JSON.stringify({userId:currentUser.id, key:encode64(panelKey)}));
}

async function recoverCredentials(){
  auCredenciales = null;
  if (!currentUser.saeplus) return;
  try { auCredenciales = await decryptCredential(currentUser, panelKey); }
  catch(e){ toast('No se pudo abrir la credencial SAEPLUS guardada. Bórrala y guárdala de nuevo.','error'); }
}

async function sessionLoad(){
  const s = JSON.parse(localStorage.getItem('cdcNoc2_session') || 'null');
  const user = s && DB.users.find(u=>u.id===s.userId);
  if (!user || !s.key){ localStorage.removeItem('cdcNoc2_session'); return; }
  currentUser = user;
  panelKey = decode64(s.key);
  await recoverCredentials();
}

async function login(username, password){
  const u = DB.users.find(u=>u.username.toLowerCase()===username.trim().toLowerCase());
  if (!u) return null;
  const material = await passwordMaterial(password, u.passwordSalt);
  if (material.hash !== u.passwordHash) return null;
  currentUser = u;
  panelKey = material.key;
  sessionSave();
  await recoverCredentials();
  logActivity('login', `${u.name} inició sesión`);
  return u;
}

async function changePanelPassword(user, password){
  const actor = currentUser.id;
  const own = user.id === actor;
  const credential = own && user.saeplus ? await decryptCredential(user, panelKey) : null;
  const material = await passwordMaterial(password);
  const encrypted = credential ? await encryptCredential(user.id, credential, material.key) : null;
  if (currentUser?.id !== actor) return false;
  const previous = {passwordSalt:user.passwordSalt, passwordHash:user.passwordHash, saeplus:user.saeplus};
  user.passwordSalt = material.salt;
  user.passwordHash = material.hash;
  if (encrypted) user.saeplus = encrypted; else delete user.saeplus;
  if (!save()){ Object.assign(user, previous); return false; }
  if (own){ panelKey = material.key; sessionSave(); }
  return true;
}

function logout(){
  logActivity('logout', `${currentUser.name} cerró sesión`);
  currentUser = null;
  panelKey = null;
  auCredenciales = null;
  localStorage.removeItem('cdcNoc2_session');
  renderLogin();
}

/* ---------------- Toast ---------------- */
function toast(msg, type='info', actions){
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = {success:'check', error:'alert', info:'info'};
  el.innerHTML = `<svg class="icon" viewBox="0 0 24 24">${iconPath(icons[type]||'info')}</svg><div class="t-msg">${esc(msg)}${actions?`<div class="t-actions">${actions.map(a=>`<button data-toast-act="${esc(a.label)}">${esc(a.label)}</button>`).join('')}</div>`:''}</div><button class="t-close" aria-label="Cerrar"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
  el.querySelector('.t-close').onclick = () => el.remove();
  if (actions) el.querySelectorAll('[data-toast-act]').forEach(b => b.onclick = () => { const a = actions.find(x=>x.label===b.dataset.toastAct); a.onClick && a.onClick(); el.remove(); });
  const repetido = [...root.children].find(x => x.dataset.toastMsg === msg);
  if (repetido) repetido.remove();
  el.dataset.toastMsg = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 320); }, 4200);
}

function kpiSpark(values, color){
  const max = Math.max(1, ...values);
  const pts = values.map((v,i)=>`${(i/(values.length-1||1))*100},${30-(v/max)*26}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
}

}

function bindTipificar(){
  const tipoSel = $('#tipTipo'), respSel = $('#tipResp'), detSel = $('#tipDet'), obs = $('#tipObs');

  tipoSel.onchange = () => {
    const map = TIPOS[tipoSel.value] || {};
    const resps = Object.keys(map);
    respSel.innerHTML = '<option value="">SELECCIONE…</option>' + resps.map(r=>`<option>${esc(r)}</option>`).join('');
    respSel.disabled = !resps.length; detSel.innerHTML='<option value="">SELECCIONE…</option>'; detSel.disabled = true;
  };
  respSel.onchange = () => {
    const dets = (TIPOS[tipoSel.value]||{})[respSel.value] || [];
    detSel.innerHTML = '<option value="">SELECCIONE…</option>' + dets.map(d=>`<option>${esc(d)}</option>`).join('');
    detSel.disabled = !dets.length;
  };

  const doSearch = () => {
    const nro = ($('#tipSearchNro').value||'').trim().toLowerCase();
    const ced = ($('#tipSearchCed').value||'').trim().toLowerCase();
    const tel = ($('#tipSearchTel').value||'').trim().toLowerCase();
    if (!nro && !ced && !tel){ toast('Ingresa un criterio de búsqueda','info'); return; }
    const hits = DB.subscribers.filter(s =>
      (nro && (s.nro||'').toLowerCase().includes(nro)) ||
      (ced && (s.cedula||'').toLowerCase().includes(ced)) ||
      (tel && (s.telefono||'').toLowerCase().includes(tel)));
    tipState.filtered = hits;
    const box = $('#tipResults');
    if (!hits.length){
      box.classList.remove('hidden');
      box.innerHTML = `<div style="padding:10px;font-size:12px;color:var(--muted)">Sin resultados en el directorio. Usa <b>Ingreso manual</b> o importa el Excel.</div>`;
      return;
    }
    box.classList.remove('hidden');
    box.innerHTML = hits.slice(0,8).map(s=>`<button class="search-result" data-pick="${s.id}"><span class="avatar">${esc(initials(s.nombre))}</span><span class="grow"><b style="font-size:12.5px">${esc(s.nombre||'Sin nombre')}</b><br><small class="muted mono">${esc(s.nro||'—')} · ${esc(s.cedula||'—')} · ${esc(s.telefono||'—')}</small></span></button>`).join('');
    $$('#tipResults [data-pick]').forEach(b => b.onclick = () => { selectSubscriber(b.dataset.pick); box.classList.add('hidden'); });
  };
  $('#tipBuscar').onclick = doSearch;
  ['tipSearchNro','tipSearchCed','tipSearchTel'].forEach(id => $('#'+id).addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); doSearch(); } }));
  $('#tipSearchNro').addEventListener('input', debounce(()=>{ if($('#tipSearchNro').value.trim().length>=3) doSearch(); else $('#tipResults').classList.add('hidden'); },350));

  $('#tipManual').onclick = () => openManualSubscriber();

  /* plantillas */
  const renderTplList = () => {
    $('#tipTplList').innerHTML = DB.templates.map(t=>`
      <div class="template-mini" data-tpl="${t.id}">
        <span class="bar" style="background:${esc(t.color||'#315cf6')}"></span>
        <div class="grow"><div class="t-name">${esc(t.name)}</div><div class="t-cat">${esc(t.category||'General')}</div></div>
        <div class="t-actions"><button class="icon-btn" data-ins="${t.id}" title="Insertar" style="width:28px;height:28px">${icon('plus')}</button></div>
      </div>`).join('');
    $$('#tipTplList [data-ins]').forEach(b => b.onclick = () => insertTemplate(b.dataset.ins));
  };
  $('#tipTplOpen').onclick = () => { const p=$('#tipTplPanel'); p.classList.toggle('hidden'); if(!p.classList.contains('hidden')) renderTplList(); };

  const obsVars = () => {
    $('#tipVarChips').innerHTML = ['{nombre}','{abonado}','{cedula}','{telefono}','{fecha}','{operador}'].map(v=>`<button class="var-chip" data-var="${v}">${v}</button>`).join('');
    $$('#tipVarChips [data-var]').forEach(b => b.onclick = () => { obs.setRangeText(b.dataset.var); obs.focus(); updateCount(); });
  };
  const updateCount = () => $('#tipCount').textContent = `${obs.value.length} caracteres`;
  obs.addEventListener('input', updateCount);
  obsVars();

  $('#tipLimpiar').onclick = () => { go('tipificar'); };

  $('#tipRegistrar').onclick = () => {
    const tipo = tipoSel.value, resp = respSel.value, det = detSel.value;
    if (!tipState.subscriber){ toast('Selecciona o ingresa un abonado primero','error'); return; }
    if (!tipo || !resp || !det){ toast('Completa tipo llamada, tipo respuesta y detalle','error'); return; }
    const rec = {
      id: uid(), userId: currentUser.id, responsible: currentUser.name, username: currentUser.username,
      date: todayStr(), time: nowTime(),
      subscriberId: tipState.subscriber.id || null,
      nroAbonado: tipState.subscriber.nro || '', cliente: tipState.subscriber.nombre || '',
      cedula: tipState.subscriber.cedula || '', telefono: tipState.subscriber.telefono || '',
      tipoLlamada: tipo, tipoRespuesta: resp, detalle: det,
      estado: $('#tipEstado').value, observacion: obs.value.trim()
    };
    DB.records.unshift(rec);
    save();
    logActivity('check', `${currentUser.name} tipificó a ${rec.cliente||rec.nroAbonado} (${tipo} → ${det})`);
    toast('Llamada registrada correctamente','success');
    $('#main .tip-main').insertAdjacentHTML('afterbegin', `<div class="success-banner">${icon('check')}<div><b>Registro guardado</b> · ${esc(rec.cliente||rec.nroAbonado)} · ${esc(tipo)} → ${esc(det)} · ${esc(rec.time)}</div></div>`);
    setTimeout(()=>go('tipificar'), 700);
  };

  updateCount();
}

function fillTemplateVars(body, sub){
  return body
    .replaceAll('{nombre}', sub?.nombre || '')
    .replaceAll('{abonado}', sub?.nro || '')
    .replaceAll('{cedula}', sub?.cedula || '')
    .replaceAll('{telefono}', sub?.telefono || '')
    .replaceAll('{fecha}', todayStr())
    .replaceAll('{operador}', currentUser.name);
}
function insertTemplate(id){
  const t = DB.templates.find(x=>x.id===id); if(!t) return;
  const text = fillTemplateVars(t.body, tipState.subscriber);
  const obs = $('#tipObs');
  obs.value = obs.value ? obs.value.replace(/\s*$/,'') + '\n' + text : text;
  obs.dispatchEvent(new Event('input'));
  $('#tipTplPanel').classList.add('hidden');
  toast(`Plantilla "${t.name}" insertada`,'success');
}

function selectSubscriber(id){
  const s = DB.subscribers.find(x=>x.id===id); if(!s) return;
  tipState.subscriber = s;
  $('#tipSearchNro').value = s.nro || '';
  $('#tipSearchCed').value = s.cedula || '';
  $('#tipSearchTel').value = s.telefono || '';
  $('#tipSubCard').classList.remove('hidden');
  $('#tipSubBody').innerHTML = `
    <div class="subscriber-top">
      <span class="avatar">${esc(initials(s.nombre))}</span>
      <div><div class="subscriber-name">${esc(s.nombre||'Sin nombre')}</div><small class="muted">Abonado del directorio importado</small></div>
    </div>
    <div class="subscriber-meta">
      <div class="meta-item"><span class="k">N° Abonado</span><div class="v mono">${esc(s.nro||'—')}</div></div>

/* ================================================================
   TIPIFICACIÓN AUTOMÁTICA — cola masiva para SAEPLUS
   La pagina habla con el robot local  python saeplus_bot.py --servidor
   (escuchando en 127.0.0.1:8765) y muestra un monitor en vivo de lo
   que va haciendo. Al finalizar, los resultados vuelven solos a la
   cola y al historial.
================================================================ */
const BOT_URL = "http://127.0.0.1:8765";
const BOT_PROTO = "cdcnoc2://iniciar";
let auState = { tipo:'', resp:'', det:'', tpl:'' };
let auFile = { rows:[], mapping:{nombre:-1, nro:-1, cedula:-1, telefono:-1} };
let auMonTimer = null;
let auStarting = false;
let auPolling = false;
let auFinishing = false;

async function auServerUp(){
  try {
    const r = await fetch(BOT_URL + '/health', { cache:'no-store' });
    return r.ok && (await r.json()).app === 'cdc-noc-2';
  } catch(e){ return false; }
}
function auLaunchRobot(){
  try { window.location.href = BOT_PROTO; } catch(e){}
}
async function auEnsureServer(msg){
  if (await auServerUp()) return true;
  msg('Robot local apagado. Iniciándolo automáticamente…');
  auLaunchRobot();
  for (let i=0;i<20;i++){
    await new Promise(r=>setTimeout(r,1000));
    if (await auServerUp()){ msg('✓ Robot local iniciado. Conectando con SAEPLUS…'); return true; }
  }
  return false;
}
async function auRefreshBotChip(){
  const el = $('#auBotChip');
  if (!el) return;
  const up = await auServerUp();
  el.className = 'chip ' + (up ? 'chip-green' : 'chip-red');
  el.innerHTML = '<span class="dot"></span> ROBOT ' + (up ? 'EN LÍNEA' : 'APAGADO');
}

function auQueue(){ DB.queue = DB.queue || []; return DB.queue; }
function auStats(){
  const q = auQueue();
  return {
    total: q.length,
    pend: q.filter(x=>x.status==='PENDIENTE').length,
    done: q.filter(x=>x.status==='PROCESADO').length,
    err:  q.filter(x=>['ERROR','NO ENCONTRADO','REVISAR'].includes(x.status)).length,
    retry: q.filter(x=>['ERROR','NO ENCONTRADO'].includes(x.status)).length,
    hoy:  DB.records.filter(r=>r.estado==='COMPLETADO' && r.date===todayStr()).length
  };
}
function auChip(status){
  return { 'PENDIENTE':'chip-amber', 'PROCESADO':'chip-green',
           'ERROR':'chip-red', 'NO ENCONTRADO':'chip-red', 'REVISAR':'chip-amber' }[status] || 'chip-gray';
}
function auAddItem(d){
  const q = auQueue();
  const nro = (d.nro||'').trim(), ced = (d.cedula||'').trim(), tel = (d.telefono||'').trim();
  if (!nro && !ced) return false;
  if (q.some(x => (nro && x.nro===nro) || (ced && x.cedula===ced))) return false; // duplicado
  if (DB.records.some(r => r.date===todayStr() && ((ced && r.cedula===ced) || (nro && r.nroAbonado===nro)))) return false; // ya tipificado hoy
  q.push({ id: uid(), nro, cedula:ced, telefono:tel, nombre:(d.nombre||'').trim(),
           tipo:auState.tipo, respuesta:auState.resp, detalle:auState.det,
           observacion: auState.tpl, status:'PENDIENTE', log:'', ts:'' });
  return true;
}

/* ---------- carga de la lista (solo Excel / TXT) ---------- */
function auHandleFile(file){
  const done = rows => { if(!rows.length){ toast('El archivo está vacío','error'); return; } auFile.rows = rows; auBuildMapping(); };
  const name = file.name.toLowerCase();
  if (name.endsWith('.csv') || name.endsWith('.txt')){
    file.text().then(text=>done(parseCSV(text))).catch(err=>toast('No se pudo leer el archivo: '+err.message,'error'));
  } else if (typeof XLSX === 'undefined'){
    toast('Para leer Excel se necesita internet la primera vez (librería XLSX). Guarda como CSV/TXT e intenta de nuevo.','error');
  } else {
    file.arrayBuffer().then(b=>{
      const wb = XLSX.read(b, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      done(XLSX.utils.sheet_to_json(ws, {header:1, defval:''}).filter(r=>r.some(c=>String(c).trim()!=='')));
    }).catch(err=>toast('No se pudo leer el archivo: '+err.message,'error'));
  }
}

function auBuildMapping(){
  const rows = auFile.rows;
  const headers = rows[0].map(h=>String(h).trim());
  const sel = (id,label,keys)=>{
    const g = guessCol(headers, keys);
    return `<div class="field"><label>${label}</label><select class="input" data-au-map="${id}"><option value="-1">— Omitir —</option>${headers.map((h,i)=>`<option value="${i}" ${i===g?'selected':''}>${esc(h)}</option>`).join('')}</select></div>`;
  };
  $('#auMapWrap').classList.remove('hidden');
  $('#auMapBody').innerHTML = `
    <div class="inline-alert success">${icon('check')} ${rows.length-1} fila(s) detectadas. Confirma el mapeo de columnas:</div>
    <div class="mapping-grid">
      ${sel('nombre','Columna → Nombre',['nombre','cliente','razon','razón'])}
      ${sel('nro','Columna → N° abonado (anterior)',['abonado','anterior','contrato','nro','numero','número'])}
      ${sel('cedula','Columna → Cédula / documento',['cedula','cédula','documento','identidad','dni','rif'])}
      ${sel('telefono','Columna → Teléfono',['telefono','teléfono','celular','movil','móvil','contacto'])}
    </div>
    <div class="field"><label>Vista previa</label><div class="import-preview"><table id="auMapPreview"></table></div></div>
    <button class="btn btn-primary btn-block" id="auMapAdd">${icon('plus')} Añadir a la cola</button>`;
  const renderPrev = () => {
    const g = k => parseInt($(`[data-au-map="${k}"]`).value);
    auFile.mapping = {nombre:g('nombre'), nro:g('nro'), cedula:g('cedula'), telefono:g('telefono')};
    const pick = (r,i) => i>-1 ? String(r[i]??'').trim() : '';
    $('#auMapPreview').innerHTML = '<thead><tr><th>#</th><th>Nombre</th><th>N° abonado</th><th>Cédula</th><th>Teléfono</th></tr></thead><tbody>' +
      rows.slice(1,7).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(pick(r,auFile.mapping.nombre))}</td><td class="mono">${esc(pick(r,auFile.mapping.nro))}</td><td class="mono">${esc(pick(r,auFile.mapping.cedula))}</td><td class="mono">${esc(pick(r,auFile.mapping.telefono))}</td></tr>`).join('') + '</tbody>';
  };
  $$('#auMapBody [data-au-map]').forEach(s=>s.onchange=renderPrev);
  renderPrev();
  $('#auMapAdd').onclick = () => {
    const m = auFile.mapping;
    if (m.nro<0 && m.cedula<0){ toast('Mapea el número de abonado o la cédula; el teléfono solo no permite buscar en SAEPLUS','error'); return; }
    const pick = (r,i) => i>-1 ? String(r[i]??'').trim() : '';
    let n = 0;
    rows.slice(1).forEach(r=>{ if (auAddItem({nombre:pick(r,m.nombre), nro:pick(r,m.nro), cedula:pick(r,m.cedula), telefono:pick(r,m.telefono)})) n++; });
    save();
    toast(n?`${n} cliente(s) añadidos a la cola`:'Nada nuevo que añadir (¿duplicados o filas vacías?)', n?'success':'info');
    logActivity('plus', `${currentUser.name} cargó ${n} clientes en la cola automática`);
    refreshPage();
  };
}

/* ---------- ejecución con un clic contra el robot local ---------- */
function auMonLog(msg){
  const el = $('#auMonLog');
  if (!el) return;
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

async function auStart(){
  if (auStarting || auMonTimer) return;
  const pend = auQueue().filter(x=>x.status==='PENDIENTE');
  if (!pend.length){ toast('No hay clientes pendientes en la cola','info'); return; }
  const s = auCredenciales;
  if (!s || !s.usuario || !s.contrasena){ toast('Primero ingresa tus credenciales SAEPLUS (paso 4)','error'); return; }
  const incompletos = pend.filter(x=>!x.tipo || !x.respuesta || !x.detalle || !x.observacion);
  if (incompletos.length){ toast(`Hay ${incompletos.length} pendiente(s) sin tipo/respuesta/detalle o sin plantilla. Selecciona la plantilla y aplica los valores en el paso 2.`,'error'); return; }
  auStarting = true;
  $('#auStart').disabled = true;
  $('#auMonitor').classList.remove('hidden');
  $('#auMonLog').textContent = '';
  auMonLog('Comprobando el robot local (127.0.0.1:8765)…');
  if (!await auEnsureServer(auMonLog)){
    auMonLog('No se pudo iniciar el robot automáticamente. Instala el arranque con REGISTRAR_ARRANQUE.reg o inicia INICIAR_PANEL.pyw y vuelve a pulsar TIPIFICAR.');
    toast('No se pudo iniciar el robot local','error');
    auStarting = false;
    if ($('#auStart')) $('#auStart').disabled = false;
    return;
  }
  auMonLog('Enviando la cola a SAEPLUS…');
  auRefreshBotChip();
  let res;
  try {
    res = await fetch(BOT_URL + '/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: pend.map(x => ({...x})),
        credenciales: { usuario: s.usuario, contrasena: s.contrasena, empresa: s.empresa || 'WAVE' }
      })
    });
  } catch(e){
    auMonLog('El servidor local no responde (127.0.0.1:8765). Inicia CDC NOC 2 con el acceso de escritorio o INICIAR_PANEL.pyw y vuelve a pulsar TIPIFICAR.');
    toast('Servidor local no responde: inicia INICIAR_PANEL.pyw y reintenta','error');
    auStarting = false;
    if ($('#auStart')) $('#auStart').disabled = false;
    return;
  }
  auStarting = false;
  let j = {};
  try { j = await res.json(); } catch(e){}
  if (!j.ok){ auMonLog('El robot rechazó la ejecución: ' + (j.msg || 'error desconocido')); toast(j.msg || 'El robot no pudo iniciar','error'); if ($('#auStart')) $('#auStart').disabled = false; return; }
  pend.forEach(x=>{ x.status='REVISAR'; x.log='Ejecución en curso; esperar los resultados antes de repetir'; });
  save();
  if ($('#auStart')) $('#auStart').disabled = true;
  auMonLog('Robot ejecutando SAEPLUS en segundo plano. No necesitas salir de esta página.');
  auMonLog('Puedes cambiar de sección; el monitor se recupera al volver a Tipificar.');
  if (auMonTimer) clearInterval(auMonTimer);
  auMonTimer = setInterval(auPoll, 1500);
  auPoll();
}

async function auPoll(){
  if (auPolling) return;
  if (!$('#auMonitor')){ clearInterval(auMonTimer); auMonTimer = null; return; }
  auPolling = true;
  try {
    const j = await (await fetch(BOT_URL + '/status')).json();
    const prog = $('#auMonProg');
    if (prog) prog.textContent = `${j.procesados}/${j.total}`;
    const log = $('#auMonLog');
    if (log){
      const texto = (j.log || []).join('\n');
      if (texto) log.textContent = texto + '\n';
      log.scrollTop = log.scrollHeight;
    }
    if (j.terminado){
      if (auMonTimer) clearInterval(auMonTimer);
      auMonTimer = null;
      await auFinish();
    }
  } catch(e){ auMonLog('Conexión interrumpida. No repitas la cola; el monitor intentará recuperarla.'); }
  finally { auPolling = false; }
}

async function auResume(){
  if (!auQueue().some(x=>x.status==='REVISAR')) return;
  try {
    const r = await fetch(BOT_URL + '/status', { cache:'no-store' });
    if (!r.ok) return;
    const st = await r.json();
    if (st.corriendo){
      if (!$('#auMonitor')) return;
      $('#auMonitor').classList.remove('hidden');
      $('#auStart').disabled = true;
      if (auMonTimer) clearInterval(auMonTimer);
      auMonTimer = setInterval(auPoll, 1500);
      auPoll();
    } else if (st.terminado){
      await auFinish(true);
    }
  } catch(e){ auMonLog('No se pudo recuperar la ejecución. Conserva los estados REVISAR hasta comprobar SAEPLUS.'); }
}

function auRegistrarHistorial(x){
  DB.records.unshift({ id: uid(), registroSaeplus: x.registroSaeplus || '', userId: currentUser.id, responsible: currentUser.name, username: currentUser.username,
    date: todayStr(), time: nowTime(), subscriberId: null,
    nroAbonado: x.nroSaeplus || x.nro || '', cliente: x.clienteSaeplus || x.nombre || '', cedula: x.cedula || '', telefono: x.telefono || '',
    tipoLlamada: x.tipo || '', tipoRespuesta: x.respuesta || '', detalle: x.detalle || '',
    estado: 'COMPLETADO',
    observacion: x.observacion ? fillTemplateVars(x.observacion, x) : '' });
}

async function auFinish(silent=false){
  if (auFinishing) return;
  auFinishing = true;
  auMonLog('✓ Ejecución terminada. Descargando resultados…');
  let items;
  try { items = (await (await fetch(BOT_URL + '/results')).json()).items || []; }
  catch(e){ auFinishing = false; auMonLog('No se pudieron obtener los resultados; consulta el servidor antes de reintentar.'); toast('No se pudieron obtener los resultados','error'); return; }
  let n = 0;
  const salen = [];
  items.forEach(i=>{
    const x = auQueue().find(q=>q.id===i.id);
    if (!x) return;
    const yaProcesado = x.status === 'PROCESADO';
    if (yaProcesado && i.status !== 'PROCESADO') return;
    const cambio = x.status !== i.status || (x.log||'') !== (i.log||'');
    x.status = i.status; x.log = i.log || ''; x.ts = i.ts || ''; x.registroSaeplus = i.registro_saeplus || i.registroSaeplus || '';
    x.nroSaeplus = i.abonado_saeplus || ''; x.clienteSaeplus = i.cliente_saeplus || '';
    if (cambio) n++;
    if (i.status === 'PROCESADO' && !yaProcesado){
      auRegistrarHistorial(x);
      salen.push(x.id);
    }
  });
  if (salen.length) DB.queue = DB.queue.filter(q=>!salen.includes(q.id));
  save(); updateBadges();
  auMonLog(`✓ ${n} resultado(s) actualizados; ${salen.length} salieron de la cola hacia el historial.`);
  const ok = items.filter(i=>i.status==='PROCESADO').length;
  if (!silent && n > 0){
    toast(`Tipificación finalizada: ${ok} registrado(s) en SAEPLUS${salen.length?`, ${salen.length} salieron de la cola`:''}.${items.length-ok?` ${items.length-ok} requieren revisión`:''}`, ok===items.length?'success':'info');
    setTimeout(()=>{ if (currentPage==='auto') refreshPage(); }, 1600);
  }
  if ($('#auStart')) $('#auStart').disabled = false;
  auFinishing = false;
}

function bindAuto(){
  const tipo=$('#auTipo'), resp=$('#auResp'), det=$('#auDet'), tpl=$('#auTpl');
  tipo.onchange=()=>{ auState.tipo=tipo.value; auState.resp=''; auState.det='';
    resp.innerHTML='<option value="">SELECCIONE…</option>'+Object.keys(TIPOS[tipo.value]||{}).map(r=>`<option>${esc(r)}</option>`).join('');
    resp.disabled=!tipo.value; det.innerHTML='<option value="">SELECCIONE…</option>'; det.disabled=true; };
  resp.onchange=()=>{ auState.resp=resp.value; auState.det='';
    det.innerHTML='<option value="">SELECCIONE…</option>'+(TIPOS[auState.tipo][resp.value]||[]).map(d=>`<option>${esc(d)}</option>`).join('');
    det.disabled=!resp.value; };
  det.onchange=()=>{ auState.det=det.value; };
  const prev=()=>{ auState.tpl=tpl.value;
    $('#auTplPrev').textContent=fillTemplateVars(auState.tpl||'— Sin plantilla: la observación quedará en blanco —',{nombre:'NOMBRE DEL CLIENTE',nro:'WM000000',cedula:'V00000000',telefono:'04XX0000000'}); };
  tpl.onchange=prev;

  const drop = $('#auDrop');
  drop.onclick = () => $('#auFile').click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
  drop.ondragleave = () => drop.classList.remove('drag');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag'); if (e.dataTransfer.files[0]) auHandleFile(e.dataTransfer.files[0]); };
  $('#auFile').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) auHandleFile(f); e.target.value=''; });

  $('#auApply').onclick=()=>{
    if(!auState.tipo||!auState.resp||!auState.det||!auState.tpl){ toast('Completa tipo, respuesta, detalle y selecciona una plantilla (obligatoria)','error'); return; }
    let n=0;
    auQueue().forEach(x=>{ if(x.status==='PENDIENTE'){ x.tipo=auState.tipo; x.respuesta=auState.resp; x.detalle=auState.det; x.observacion=auState.tpl; n++; } });
    save(); toast(`Valores aplicados a ${n} pendiente(s)`,'success'); refreshPage();
  };
  $('#auExport').onclick=()=>{
    const data={ app:'cdc-noc-2', exportado:`${todayStr()} ${nowTime()}`, responsable:currentUser.name,
      items: auQueue().map(x=>({...x})) };
    download(`cola_saeplus_${todayStr().replace(/\//g,'-')}.json`, JSON.stringify(data,null,2), 'application/json');
    toast('Cola exportada. Ponla junto a saeplus_bot.py','success');
  };
  $('#auImportBtn').onclick=()=>$('#auImport').click();
  $('#auImport').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const data=JSON.parse(await f.text());
      if (!Array.isArray(data.items)) throw new Error('La cola no contiene una lista de clientes');
      let n=0;
      data.items.forEach(i=>{
        if (!i || typeof i.id!=='string' || !/^[A-Za-z0-9_-]{1,100}$/.test(i.id) || !['PENDIENTE','PROCESADO','ERROR','NO ENCONTRADO','REVISAR'].includes(i.status)) return;
        const x=auQueue().find(q=>q.id===i.id);
        if (x && i.status!=='PENDIENTE'){
          if (x.status==='PROCESADO' && i.status!=='PROCESADO') return;
          x.status=i.status; x.log=String(i.log||''); x.ts=String(i.ts||'');
          x.registroSaeplus=String(i.registro_saeplus||i.registroSaeplus||x.registroSaeplus||''); n++;
        }
        else if (!x){
          const fields=['nro','cedula','telefono','nombre','tipo','respuesta','detalle','observacion','log','ts'];
          const item={id:i.id,status:i.status};
          fields.forEach(k=>item[k]=String(i[k]||''));
          item.registroSaeplus=String(i.registro_saeplus||i.registroSaeplus||'');
          auQueue().push(item); n++;
        }
      });
      save(); toast(`${n} cliente(s) importados o actualizados`,'success'); refreshPage();
    }catch(err){ toast('JSON inválido: '+err.message,'error'); }
  });
  $('#auRetryErrors').onclick=()=>{
    const fallidos=auQueue().filter(x=>['ERROR','NO ENCONTRADO'].includes(x.status));
    if (!fallidos.length) return;
    fallidos.forEach(x=>{ x.status='PENDIENTE'; x.log=''; x.ts=''; });
    save(); toast(`${fallidos.length} cliente(s) listos para reintentar`,'success'); refreshPage();
  };
  $('#auClear').onclick=()=>{
    openModal(`${modalHead('Vaciar cola')}<div class="modal-body"><p>Se quitarán los ${auQueue().length} cliente(s) de la cola.</p></div>
      <div class="modal-foot"><button class="btn btn-outline" data-action="modal-close">Cancelar</button><button class="btn btn-danger" id="auClearOk">${icon('trash')} Vaciar</button></div>`);
    $('#auClearOk').onclick=()=>{ DB.queue=[]; save(); closeModal(); toast('Cola vaciada','success'); refreshPage(); };
  };
  $$('[data-au-del]').forEach(b=>b.onclick=()=>{
    DB.queue=DB.queue.filter(x=>x.id!==b.dataset.auDel);
    save(); refreshPage();
  });
  $$('[data-au-retry]').forEach(b=>b.onclick=()=>{
    const item=auQueue().find(x=>x.id===b.dataset.auRetry);
    if (item && ['ERROR','NO ENCONTRADO'].includes(item.status)){ item.status='PENDIENTE'; item.log=''; item.ts=''; save(); refreshPage(); }
  });
  $$('[data-au-confirm]').forEach(b=>b.onclick=()=>{
    const x=auQueue().find(q=>q.id===b.dataset.auConfirm);
    if (!x || x.status!=='REVISAR') return;
    x.status='PROCESADO';
    x.log='Confirmado manualmente: registro verificado en SAEPLUS';
    x.ts=new Date().toISOString();
    if (!DB.records.some(r=>(x.registroSaeplus && r.registroSaeplus===x.registroSaeplus)
        || (r.cliente===(x.clienteSaeplus||x.nombre) && r.nroAbonado===(x.nroSaeplus||x.nro) && r.date===todayStr())))
      auRegistrarHistorial(x);
    save(); updateBadges(); toast('Registro marcado como procesado y añadido al historial','success'); refreshPage();
  });
  $('#auCredShow').onclick=()=>{ const c=$('#auCredPass'); c.type=c.type==='password'?'text':'password'; };
  $('#auCredSave').onclick=async e=>{
    const usuario=$('#auCredUser').value.trim(), contrasena=$('#auCredPass').value, empresa=$('#auCredEmp').value.trim()||'WAVE';
    if(!usuario||!contrasena){ toast('Ingresa usuario y contraseña SAEPLUS','error'); return; }
    const user=currentUser, button=e.currentTarget, credential={usuario, contrasena, empresa};
    button.disabled=true;
    try {
      const encrypted=await encryptCredential(user.id, credential, panelKey);
      if(currentUser?.id!==user.id) return;
      const previous=user.saeplus;
      user.saeplus=encrypted;
      if(!save()){ user.saeplus=previous; return; }
      auCredenciales=credential;
      toast('Credenciales cifradas guardadas para '+user.name,'success');
      if(currentPage==='auto') refreshPage();
    } catch(err){ toast('No se pudieron guardar las credenciales: '+err.message,'error'); }
    finally { button.disabled=false; }
  };
  $('#auCredForget').onclick=()=>{
    const previous=currentUser.saeplus;
    delete currentUser.saeplus;
    if(!save()){ currentUser.saeplus=previous; return; }
    auCredenciales=null;
    toast('Credenciales SAEPLUS borradas de tu usuario','success'); refreshPage();
  };
  $('#auStart').onclick=auStart;
  $('#auBoot').onclick=async ()=>{
    toast('Iniciando el robot local…','info');
    const ok = await auEnsureServer(m=>auMonLog(m));
    auRefreshBotChip();
    toast(ok ? 'Robot local en línea' : 'No se pudo iniciar; ejecuta INICIAR_PANEL.pyw', ok?'success':'error');
  };
  $('#auExportHist').onclick=exportRecordsCSV;
  auRefreshBotChip();
  prev();
  auResume();
}

function openDigytoPortal(){
  window.open('https://atlas.digyto.ai/campaigns/meta', '_blank', 'noopener,noreferrer');

function digytoPhone(value){
  let number = String(value || '').trim().replace(/[\s()+.-]/g,'');
  if (/^00\d+$/.test(number)) number = number.slice(2);
  if (/^04\d{9}$/.test(number)) number = '58' + number.slice(1);
  else if (/^4\d{9}$/.test(number)) number = '58' + number;
  return /^[1-9]\d{7,14}$/.test(number) ? number : '';
}

function exportDigyto(){
  const list = audienceList();
  if (!list.length){ toast('No hay destinatarios seleccionados','error'); return; }
  if (typeof XLSX === 'undefined'){ toast('No se cargó la librería Excel. Recarga el panel desde CDC NOC 2.','error'); return; }
  const rows = [['number','name']], seen = new Set();
  for (const s of list){
    const number = digytoPhone(s.telefono);
    if (!number){ toast(`Teléfono inválido: ${s.nombre || s.nro || 'contacto'}. Corrígelo antes de exportar.`,'error'); return; }
    if (seen.has(number)) continue;
    seen.add(number);
    rows.push([number, s.nombre || s.nro || 'Cliente']);
  }
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(rows), 'template');
  XLSX.writeFile(workbook, 'digybot_Campaign.xlsx');
  toast(`${rows.length-1} contacto(s) exportados; todavía no se ha enviado ningún mensaje`,'success');
}

async function subirInformeDrive(id){
  const inf = DB.informes.find(x=>x.id===id);
  const d = DB.drive || {};
  if (!inf.dataUrl){ toast('Este informe no tiene archivo adjunto','error'); return; }
  if (!d.token && !d.apiKey){ toast('Configura primero la conexión con Google Drive','error'); return; }
  toast('Subiendo a Google Drive…','info');
  try {
    const bin = atob(inf.dataUrl.split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const boundary = 'cdc_noc_2_boundary';
    const metadata = { name: inf.archivo || ('informe-cdc-'+inf.mes) };
    if (d.folderId) metadata.parents = [d.folderId];
    const body = new Blob([
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`,
      `--${boundary}\r\nContent-Type: application/octet-stream\r\n\r\n`,
      bytes,
      `\r\n--${boundary}--`
    ]);
    const headers = { 'Content-Type': `multipart/related; boundary=${boundary}` };
    if (d.token) headers['Authorization'] = `Bearer ${d.token}`;
    const url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart' + (d.apiKey ? `&key=${encodeURIComponent(d.apiKey)}` : '');
    const res = await fetch(url, { method:'POST', headers, body });
    const j = await res.json();
    if (!res.ok) throw new Error((j.error && j.error.message) || ('HTTP '+res.status));
    inf.subidoDrive = true; save();
    toast('Informe subido a Google Drive','success'); refreshPage();
  } catch(err){ toast('Error al subir a Drive: '+err.message,'error'); }
}

async function handleImportFile(file){
  try {
    let rows = [];
    const name = file.name.toLowerCase();
    if (name.endsWith('.csv') || name.endsWith('.txt')){
      const text = await file.text();
      rows = parseCSV(text);
    } else {
      if (typeof XLSX === 'undefined'){ toast('Librería XLSX no cargada (se necesita internet la primera vez). Guarda como CSV e intenta de nuevo.','error'); return; }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
    }
    if (!rows.length){ toast('El archivo está vacío','error'); return; }
    importData.rows = rows;
    buildImportUI();
  } catch(err){ console.error(err); toast('No se pudo leer el archivo: ' + err.message, 'error'); }
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const counts = {',':0, ';':0, '\t':0};
  let quoted = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (c==='"'){
      if (quoted && text[i+1]==='"'){ i++; continue; }
      quoted = !quoted;
    } else if (!quoted){
      if (c==='\n') break;
      if (c in counts) counts[c]++;
    }
  }
  const delimiter = Object.keys(counts).reduce((a,b)=>counts[b]>counts[a]?b:a, ',');
  const rows = []; let row = [], value = ''; quoted = false;
  const finishRow = () => {
    row.push(value);
    if (row.some(v=>v.trim())) rows.push(row);
    row = []; value = '';
  };
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (c==='"'){
      if (quoted && text[i+1]==='"'){ value+='"'; i++; }
      else quoted = !quoted;
    } else if (!quoted && c===delimiter){ row.push(value); value=''; }
    else if (!quoted && c==='\n') finishRow();
    else value+=c;
  }
  if (quoted) throw new Error('Hay comillas sin cerrar en el archivo');
  finishRow();
  return rows;
}

function guessCol(headers, keys){
  const lower = headers.map(h=>String(h).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
  for (const k of keys){ const i = lower.findIndex(h=>h.includes(k)); if (i>-1) return i; }
  return -1;
}

    })).filter(s=>s.nro||s.cedula||s.telefono);
    const replace = $('#impReplace').checked;

    logActivity('excel', `${currentUser.name} importó ${subs.length} abonados (${replace?'reemplazando':'agregando'})`);

    } catch(err){ toast('No se pudo actualizar el perfil: '+err.message,'error'); }
    finally { button.disabled=false; }
  };
  $('#btnLogout').onclick=logout;
  $('#btnRestore').onclick=()=>$('#backupFile').click();
  $('#btnReset').onclick=()=>{
    openModal(`${modalHead('Restablecer aplicación')}<div class="modal-body"><div class="inline-alert error">${icon('alert')} Se borrarán TODOS los datos: usuarios (excepto admin), abonados, registros, plantillas y campañas.</div></div>
      <div class="modal-foot"><button class="btn btn-outline" data-action="modal-close">Cancelar</button><button class="btn btn-danger" id="resetOk">${icon('trash')} Sí, restablecer</button></div>`);
    $('#resetOk').onclick=()=>{ const users=DB.users.filter(u=>u.role==='Admin'); localStorage.removeItem(KEY); localStorage.removeItem('cdcNoc2_session'); sessionStorage.clear(); location.reload(); };
  };
  $$('[data-edit-user]').forEach(b=>b.onclick=()=>openUserForm(b.dataset.editUser));
  $$('[data-del-user]').forEach(b=>b.onclick=()=>{
    const u=DB.users.find(x=>x.id===b.dataset.delUser);
    openModal(`${modalHead('Eliminar usuario')}<div class="modal-body"><p>¿Eliminar al usuario <b>${esc(u.name)}</b> (${esc(u.username)})? Sus registros históricos se conservan.</p></div>
      <div class="modal-foot"><button class="btn btn-outline" data-action="modal-close">Cancelar</button><button class="btn btn-danger" id="delUserOk">${icon('trash')} Eliminar</button></div>`);
    $('#delUserOk').onclick=()=>{DB.users=DB.users.filter(x=>x.id!==u.id);save();closeModal();toast('Usuario eliminado','success');refreshPage();};
  });
}

/* ================================================================
   EXPORTACIONES / RESPALDOS
================================================================ */
function download(filename, content, mime='text/plain'){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}
function exportBackup(){
  download(`cdc-noc2-respaldo-${todayStr()}.json`, JSON.stringify(DB,null,2), 'application/json');
  toast('Respaldo exportado','success');
}
function exportCSV(name, rows){
  if (!rows.length){ toast('No hay datos para exportar','info'); return; }
  const escC = v => { v=String(v??''); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  download(name, rows.map(r=>r.map(escC).join(',')).join('\n'), 'text/csv');
}
function exportRecordsCSV(){
  exportCSV(`tipificaciones-${todayStr()}.csv`, [
    ['Fecha','Hora','Responsable','Usuario','Cliente','N°Abonado','Cédula','Teléfono','Tipo llamada','Tipo respuesta','Detalle','Estado','Observación'],
    ...DB.records.map(r=>[r.date,r.time,r.responsible,r.username,r.cliente,r.nroAbonado,r.cedula,r.telefono,r.tipoLlamada,r.tipoRespuesta,r.detalle,r.estado,(r.observacion||'').replace(/\n/g,' ')])
  ]);
  toast('Historial exportado a CSV','success');
}
function exportSubsCSV(){
  exportCSV(`abonados-${todayStr()}.csv`, [
    ['N° Abonado','Nombre','Cédula','Teléfono'],
    ...DB.subscribers.map(s=>[s.nro,s.nombre,s.cedula,s.telefono])
  ]);
  toast('Abonados exportados a CSV','success');
}
function exportAudience(){
  const list = audienceList();
  if (!list.length){ toast('No hay destinatarios seleccionados','error'); return; }
  exportCSV(`audiencia-${todayStr()}.csv`, [
    ['Nombre','Teléfono','N° Abonado','Cédula','Mensaje'],
    ...list.map(s=>[s.nombre,s.telefono,s.nro,s.cedula, fillTemplateVars($('#msgBody')?.value||'', s)])
  ]);
  toast('Audiencia exportada para tu plataforma de envíos','success');
}

/* ================================================================
   PALETA DE COMANDOS (Ctrl+K) / NOTIFICACIONES
================================================================ */
function openCommand(){
  if (!currentUser) return;
  $('#popoverRoot').innerHTML = `<div class="popover" style="left:50%;right:auto;transform:translateX(-50%);top:calc(var(--topbar) + 8px);width:min(560px,calc(100vw - 32px))">
    <div class="input-icon" style="margin-bottom:8px">${icon('check')}<input class="input" id="cmdInput" placeholder="Buscar abonado, plantilla, página o registro…" style="border-radius:12px"></div>
    <div class="command-results" id="cmdResults"></div></div>`;
  const input = $('#cmdInput'); input.focus();
  const close = () => $('#popoverRoot').innerHTML='';
  input.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
  document.addEventListener('mousedown', function h(e){ if(!e.target.closest('.popover')){ close(); document.removeEventListener('mousedown',h);} });
  const run = () => {
    const q = input.value.toLowerCase();
    const items = [];
    Object.values(PAGES).forEach((p,i)=>items.push({group:'Páginas', label:p.title, sub:p.crumb, run:()=>go(Object.keys(PAGES)[i])}));
    DB.subscribers.filter(s=>!q||(s.nombre||'').toLowerCase().includes(q)||(s.nro||'').toLowerCase().includes(q)||(s.cedula||'').toLowerCase().includes(q)).slice(0,5)
      .forEach(s=>items.push({group:'Abonados', label:s.nombre||s.nro, sub:`${s.nro||''} · ${s.telefono||''}`, run:()=>{go('tipificar');setTimeout(()=>selectSubscriber(s.id),60);}}));
    DB.templates.filter(t=>!q||t.name.toLowerCase().includes(q)).slice(0,4)
      .forEach(t=>items.push({group:'Plantillas', label:t.name, sub:t.category, run:()=>{go('plantillas');}}));
    DB.records.filter(r=>q&&((r.cliente||'').toLowerCase().includes(q)||(r.nroAbonado||'').toLowerCase().includes(q))).slice(0,5)
      .forEach(r=>items.push({group:'Registros', label:r.cliente||r.nroAbonado, sub:`${r.date} · ${r.tipoLlamada}`, run:()=>{hiState.q=q;go('historial');}}));
    const filtered = q ? items.filter(i=>(i.label||'').toLowerCase().includes(q)||i.group==='Páginas') : items.slice(0,9);
    const groups = [...new Set(filtered.map(i=>i.group))];
    $('#cmdResults').innerHTML = groups.map(g=>`<div class="command-group">${g}</div>`+filtered.filter(i=>i.group===g).map(i=>`<button class="command-item" data-ci="${filtered.indexOf(i)}"><span class="grow">${esc(i.label)}<br><small class="muted">${esc(i.sub||'')}</small></span></button>`).join('')).join('') || '<p class="muted" style="padding:14px;font-size:12.5px">Sin resultados.</p>';
    $$('#cmdResults .command-item').forEach(b=>b.onclick=()=>{ close(); filtered[+b.dataset.ci].run(); });
  };
  input.addEventListener('input', run); run();
}

function openNotifications(){
  if (!currentUser) return;
  $('#notifDot').style.display='none';
  $('#popoverRoot').innerHTML = `<div class="popover"><div class="row-between" style="margin-bottom:6px"><h3>Actividad reciente</h3><button class="icon-btn" data-action="modal-close">${icon('trash')}</button></div><div class="list">
    ${DB.activity.slice(0,15).map(a=>`<div class="activity-item"><span class="a-icon" style="background:var(--blue-soft);color:var(--blue)">${icon('info')}</span><div class="grow"><div style="font-size:12px">${esc(a.text)}</div><span class="a-time">${esc(a.date)} · ${esc(a.time)}</span></div></div>`).join('')||'<p class="muted" style="font-size:12.5px">Sin actividad.</p>'}
  </div></div>`;
  $$('#popoverRoot [data-action="modal-close"]').forEach(b=>b.onclick=()=>$('#popoverRoot').innerHTML='');
  document.addEventListener('mousedown', function h(e){ if(!e.target.closest('.popover')){ $('#popoverRoot').innerHTML=''; document.removeEventListener('mousedown',h);} });
}

function openHelp(){
  openModal(`${modalHead('Ayuda · CDC NOC 2')}
    <div class="modal-body grid" style="font-size:13px;color:var(--ink-3)">
      <div class="inline-alert info">${icon('info')} Flujo rápido: <b>1)</b> importa tu Excel de abonados, <b>2)</b> en Tipificar busca por n° de abonado anterior, cédula o teléfono, <b>3)</b> completa tipo de llamada → respuesta → detalle, <b>4)</b> inserta una plantilla en Observación y <b>5)</b> REGISTRAR. Todo queda guardado con tu usuario.</div>
      <div><b>Usuarios:</b> el usuario inicial es <span class="mono">admin / admin123</span>. Crea operadores desde Ajustes para que cada quien tipifique a su nombre.</div>
      <div><b>Datos:</b> se guardan localmente en el navegador. Usa «Exportar respaldo» en Ajustes periódicamente.</div>
      <div><b>Mensajería:</b> selecciona abonados con teléfono, redacta el mensaje y envía por otra plataforma o exporta el CSV de audiencia.</div>
      <div><b>SAEPLUS caído:</b> revisa el módulo «Acceso SAEPLUS / VPN» (DNS 8.8.8.8 o VPN 1.1.1.1).</div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" data-action="modal-close">Entendido</button></div>`);
}

/* ================================================================
   REFRESCO Y EVENTOS GLOBALES
================================================================ */
function refreshPage(){ go(currentPage); }

function bindPage(page){
  ({auto:bindAuto, informes:bindInformes, abonados:bindAbonados, mensajeria:bindMensajeria, plantillas:bindPlantillas, historial:bindHistorial, ajustes:bindAjustes}[page]||(()=>{}))();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action;
  switch(act){
    case 'nav': go(el.dataset.page); break;
    case 'toggle-sidebar': $('#sidebar').classList.toggle('open'); $('#sidebarOverlay').classList.toggle('show'); break;
    case 'close-sidebar': $('#sidebar').classList.remove('open'); $('#sidebarOverlay').classList.remove('show'); break;
    case 'overlay-close': if (e.target !== el) break; if (el.classList.contains('overlay')) closeModal(); if (el.classList.contains('drawer-overlay')) closeDrawer(); break;
    case 'modal-close': closeModal(); break;
    case 'open-import': if(!currentUser) break; closeModal(); openImport(); break;
    case 'export-backup': exportBackup(); break;
    case 'export-csv': exportRecordsCSV(); break;
    case 'export-subs-csv': exportSubsCSV(); break;
    case 'export-audience': exportAudience(); break;
    case 'command': openCommand(); break;
    case 'notifications': openNotifications(); break;
    case 'help': openHelp(); break;
    case 'new-subscriber': openSubscriberForm(null); break;
    case 'new-template': openTemplateForm(null); break;
    case 'new-user': openUserForm(null); break;
  }
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); currentUser ? openCommand() : null; }
  if (e.key==='Escape'){ closeModal(); closeDrawer(); $('#popoverRoot').innerHTML=''; }
});

/* Restaurar respaldo */
document.addEventListener('DOMContentLoaded', async () => {
  await load();
  await sessionLoad();
  $('#topDate').textContent = new Date().toLocaleDateString('es-VE',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  $('#backupFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if(!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data.users || !Array.isArray(data.users)) throw new Error('formato inválido');
      DB = data;
      delete DB.saeplus;
      await migratePanelPasswords();
      if(!save()) return;
      localStorage.removeItem('cdcNoc2_session');
      toast('Respaldo restaurado correctamente. Inicia sesión de nuevo…','success');
      setTimeout(()=>location.reload(), 900);
    } catch(err){ toast('Archivo de respaldo inválido: '+err.message,'error'); }
    e.target.value='';
  });
  if (currentUser){ enterApp(); } else { renderLogin(); }
});

})();
</script>
